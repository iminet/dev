<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Reserved for future use</title>
  <style>
    :root {
      --bg: #fff;
      --fg: #111;
      --border: #ddd;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111;
        --fg: #f5f5f5;
        --border: #333;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--fg);
      font: 16px/1.5 Arial, Helvetica, sans-serif;
    }
    main {
      width: 100%;
      max-width: 720px;
      padding: 32px 24px;
      border: 1px solid var(--border);
      border-radius: 12px;
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: clamp(1.5rem, 4vw, 2.25rem);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <h1>Reserved for future use</h1>
  </main>
</body>
</html>
