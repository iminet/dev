name: Hello GitHub Actions

on:
  workflow_dispatch:

jobs:
  hello:
    runs-on: ubuntu-latest

    steps:
      - name: Say hello
        run: echo "Hello from GitHub Actions!"

      - name: Show operating system
        run: uname -a

      - name: Show current directory
        run: pwd

      - name: List files
        run: ls -la

      - name: Show current time
        run: date